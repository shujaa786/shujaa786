name: GitHub Profile Static Cards Generator

on:
  schedule:
    - cron: '0 0 * * *' # Har roz automatic chalega
  workflow_dispatch: # Manual trigger enabled

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate SVG Analytics
    steps:
      - uses: actions/checkout@v4
      
      # 1. Profile Details Card (Yeh bilkul sahi kaam kar raha hai)
      - name: Generate Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: shujaa786
          THEME: dark

      # 2. Activity Graph Generate karega (Clean & Fixed Version)
      - name: Generate Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: shujaa786
          theme: react-dark
          output_path: profile-summary-card-output/dark/activity-graph.svg
