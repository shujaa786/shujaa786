name: GitHub Profile Static Cards Generator

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate SVG Analytics
    steps:
      - uses: actions/checkout@v4
      
      # 1. Profile Details Card Generate karega
      - name: Generate Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: shujaa786
          THEME: dark

      # 2. Activity Graph Generate karega
      - name: Generate Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: shujaa786
          theme: react-dark
          output_path: profile-summary-card-output/dark/activity-graph.svg

      # 3. Dono generated files ko repository me save karke push karega
      - name: Commit & Push All SVGs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add profile-summary-card-output/
          git commit -m "Auto update profile assets [skip ci]" || exit 0
          git push
